name: FreeMovement release authorization

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  fm-maintenance-release-authorization:
    name: fm-maintenance-release-authorization
    runs-on: ubuntu-latest
    steps:
      - name: Check out public base commit without persisting credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: public-source
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the exact public pull request commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git -C public-source fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          actual_head="$(git -C public-source rev-parse "refs/remotes/pull/${PR_NUMBER}/head")"
          test "${actual_head}" = "${EXPECTED_HEAD_SHA}"

      - name: Decide whether this pull request changes the plugin or its release workflows
        id: scope
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          repo = "public-source"
          base = os.environ["BASE_SHA"]
          candidate = os.environ["CANDIDATE_SHA"]
          merge_base = subprocess.run(
              ["git", "-C", repo, "merge-base", base, candidate],
              check=True, capture_output=True,
          ).stdout.decode("ascii").strip()
          raw = subprocess.run(
              ["git", "-C", repo, "diff", "--name-only", "-z", "--no-renames", "--diff-filter=ACDMRT", f"{merge_base}..{candidate}"],
              check=True, capture_output=True,
          ).stdout
          paths = [item.decode("utf-8", errors="surrogateescape") for item in raw.split(b"\0") if item]
          relevant = any(path.startswith("freemovement-law/") or path.startswith(".github/") for path in paths)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"requires_auth={'true' if relevant else 'false'}\n")
          if not relevant:
              print("No plugin or release-workflow files changed; release authorization is not applicable.")
          PY

      - name: Require a pinned checker and private registry credential
        if: steps.scope.outputs.requires_auth == 'true'
        env:
          FM_MAINTENANCE_GATE_REF: ${{ vars.FM_MAINTENANCE_GATE_REF }}
          FM_MAINTENANCE_READ_TOKEN: ${{ secrets.FM_MAINTENANCE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${FM_MAINTENANCE_GATE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FM_MAINTENANCE_GATE_REF must be set to the reviewed 40-character private commit." >&2
            exit 1
          fi
          if [[ -z "${FM_MAINTENANCE_READ_TOKEN}" ]]; then
            echo "FM_MAINTENANCE_READ_TOKEN must grant read-only access to eudirective/internal." >&2
            exit 1
          fi

      - name: Check out pinned private authorization code
        if: steps.scope.outputs.requires_auth == 'true'
        uses: actions/checkout@v4
        with:
          repository: eudirective/internal
          ref: ${{ vars.FM_MAINTENANCE_GATE_REF }}
          path: fm-gate
          token: ${{ secrets.FM_MAINTENANCE_READ_TOKEN }}
          persist-credentials: false

      - name: Check out the current private approval registry
        if: steps.scope.outputs.requires_auth == 'true'
        uses: actions/checkout@v4
        with:
          repository: eudirective/internal
          ref: main
          path: fm-registry
          token: ${{ secrets.FM_MAINTENANCE_READ_TOKEN }}
          persist-credentials: false

      - name: Verify the pinned private checker revision
        if: steps.scope.outputs.requires_auth == 'true'
        env:
          FM_MAINTENANCE_GATE_REF: ${{ vars.FM_MAINTENANCE_GATE_REF }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C fm-gate rev-parse HEAD)" = "${FM_MAINTENANCE_GATE_REF}"

      - name: Check exact-candidate release authorization
        if: steps.scope.outputs.requires_auth == 'true'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUBLIC_PR_NUMBER: ${{ github.event.pull_request.number }}
          FM_MAINTENANCE_GATE_REF: ${{ vars.FM_MAINTENANCE_GATE_REF }}
          FM_MAINTENANCE_READ_TOKEN: ${{ secrets.FM_MAINTENANCE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 fm-gate/plugins/fm-maintenance/scripts/check_release_approval.py \
            --repo-root public-source \
            --candidate-sha "${CANDIDATE_SHA}" \
            --base-sha "${BASE_SHA}" \
            --gate-commit "${FM_MAINTENANCE_GATE_REF}" \
            --public-pr-number "${PUBLIC_PR_NUMBER}" \
            --registry-root fm-registry/plugins/fm-maintenance/reviews/freemovement-law \
            --policy fm-gate/plugins/fm-maintenance/reviews/freemovement-law/reviewer-policy.json \
            --schema fm-gate/plugins/fm-maintenance/schemas/release-review.schema.json
