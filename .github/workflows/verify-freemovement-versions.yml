name: Verify freemovement-law package and consultation routing

on:
  workflow_dispatch:
  push:
    paths:
      - 'freemovement-law/**'
      - '.github/workflows/verify-freemovement-versions.yml'
  pull_request:
    paths:
      - 'freemovement-law/**'
      - '.github/workflows/verify-freemovement-versions.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core structural-check dependency
        run: python -m pip install -r freemovement-law/requirements-test.txt
      - name: Verify plugin, skill, and source-library version parity
        run: node freemovement-law/scripts/version_manifest.mjs --verify
      - name: Compile core scripts
        run: python -m compileall -q freemovement-law/skills/eudirective-core/scripts
      - name: Test synthetic consultation issue routing
        run: python freemovement-law/skills/eudirective-core/scripts/test_consultation_issue_selection.py
      - name: Test issue source preflight contract and bindings
        run: python freemovement-law/skills/eudirective-core/scripts/test_issue_source_preflight.py
      - name: Test consultation route receipt gate
        run: python freemovement-law/skills/eudirective-core/scripts/test_consultation_route_gate.py
      - name: Test invocation-aware consultation dashboard
        run: python freemovement-law/skills/eudirective-core/scripts/test_consultation_dashboard.py
      - name: Smoke-check the shared C27 check registry
        run: python freemovement-law/skills/eudirective-core/scripts/c27_case_state.py checklist > /dev/null
