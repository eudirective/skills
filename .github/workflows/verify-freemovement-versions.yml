name: Verify FreeMovement versions

on:
  workflow_dispatch:
  push:
    paths:
      - 'freemovement-law/**'
      - '.github/workflows/verify-freemovement-versions.yml'
  pull_request:
    paths:
      - 'freemovement-law/**'
      - '.github/workflows/verify-freemovement-versions.yml'

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm installed manifest matches plugin and every skill
        run: node freemovement-law/scripts/version_manifest.mjs --verify
      - name: C27 state engine regression checks
        run: python freemovement-law/skills/eudirective-core/scripts/test_c27_case_state.py
      - name: C27 abstract CLI integration smoke
        run: |
          python freemovement-law/skills/eudirective-core/scripts/c27_case_state.py checklist > /dev/null
          python freemovement-law/skills/eudirective-core/scripts/c27_case_state.py inspect --input freemovement-law/skills/eudirective-core/evaluations/fixtures/c27/multi-proceeding.json > /dev/null
          python freemovement-law/skills/eudirective-core/scripts/c27_case_state.py inspect --full --input freemovement-law/skills/eudirective-core/evaluations/fixtures/c27/multi-proceeding.json > /dev/null
          python freemovement-law/skills/eudirective-core/scripts/c27_case_state.py compare --previous freemovement-law/skills/eudirective-core/evaluations/fixtures/c27/initial.json --input freemovement-law/skills/eudirective-core/evaluations/fixtures/c27/multi-proceeding.json > /dev/null
      - name: Check version parity comparison and failure reporting
        run: |
          node --test freemovement-law/skills/eudirective-core/scripts/test_session_version_check.mjs
          node --test freemovement-law/scripts/test_version_manifest.mjs
