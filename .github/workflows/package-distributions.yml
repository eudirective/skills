name: Package FreeMovement distributions

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Build and sync FreeMovement source packages
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-distributions-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build, verify, and publish packages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the current main snapshot
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run distribution regression tests
        run: python3 scripts/package-distributions/test_build.py

      - name: Build twice and verify reproducibility
        id: build
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40,64}$ ]]
          output_one="$RUNNER_TEMP/freemovement-distributions"
          output_two="$RUNNER_TEMP/freemovement-distributions-repeat"
          python3 scripts/package-distributions/build.py all --root . --output-dir "$output_one"
          python3 scripts/package-distributions/build.py all --root . --output-dir "$output_two"
          diff -qr "$output_one" "$output_two"
          python3 scripts/package-distributions/build.py verify --root . --distribution-dir "$output_one"
          (cd "$output_one" && sha256sum -c SHA256SUMS)
          rm -rf "$output_two"
          package_count="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["packages"]))' "$output_one/packages.json")"
          expected_count="$(python3 -c 'import json; print(len(json.load(open(".agents/plugins/marketplace.json", encoding="utf-8"))["plugins"]) + 2)')"
          if [[ "$package_count" -ne "$expected_count" ]]; then
            echo "::error::Expected $expected_count packages, found $package_count"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_one" >> "$GITHUB_OUTPUT"
          echo "package_count=$package_count" >> "$GITHUB_OUTPUT"

      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: freemovement-distributions-${{ steps.build.outputs.revision }}
          path: |
            ${{ steps.build.outputs.output_dir }}/*.zip
            ${{ steps.build.outputs.output_dir }}/packages.json
            ${{ steps.build.outputs.output_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Confirm this build still matches main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          current_revision="$(git rev-parse HEAD)"
          latest_revision="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_revision" != "$latest_revision" ]]; then
            echo "::error::main advanced during packaging; refusing to publish a stale snapshot"
            exit 1
          fi
          echo "revision=$current_revision" >> "$GITHUB_OUTPUT"

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: eudirective/skills
          RELEASE_TAG: freemovement-latest
          DIST_DIR: ${{ steps.build.outputs.output_dir }}
          SOURCE_REVISION: ${{ steps.current.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          # The rolling tag is intentionally moved to the exact main snapshot being released.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" \
              --field sha="$SOURCE_REVISION" --field force=true >/dev/null
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              --field ref="refs/tags/$RELEASE_TAG" --field sha="$SOURCE_REVISION" >/dev/null
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$SOURCE_REVISION" \
              --title "FreeMovement distributions (rolling)" \
              --notes "Generated from eudirective/skills main at $SOURCE_REVISION. See packages.json and SHA256SUMS." \
              --prerelease
          else
            gh release create "$RELEASE_TAG" --target "$SOURCE_REVISION" --prerelease \
              --title "FreeMovement distributions (rolling)" \
              --notes "Generated from eudirective/skills main at $SOURCE_REVISION. See packages.json and SHA256SUMS."
          fi

          gh release upload "$RELEASE_TAG" "$DIST_DIR"/*.zip \
            "$DIST_DIR/packages.json" "$DIST_DIR/SHA256SUMS" --clobber

          release_id="$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)"
          mapfile -t expected_assets < <(find "$DIST_DIR" -maxdepth 1 -type f \
            \( -name '*.zip' -o -name packages.json -o -name SHA256SUMS \) -printf '%f\n' | sort)
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" ]] || continue
            if ! printf '%s\n' "${expected_assets[@]}" | grep -Fxq -- "$asset_name"; then
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id" >/dev/null
            fi
          done < <(gh api --paginate "repos/$GH_REPO/releases/$release_id/assets" \
            --jq '.[] | "\(.id)\t\(.name)"')

          downloaded="$RUNNER_TEMP/freemovement-release-download"
          mkdir -p "$downloaded"
          gh release download "$RELEASE_TAG" --dir "$downloaded"
          (cd "$downloaded" && sha256sum -c SHA256SUMS)
          cmp "$DIST_DIR/packages.json" "$downloaded/packages.json"
          downloaded_count="$(find "$downloaded" -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')"
          expected_zip_count="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["packages"]))' "$DIST_DIR/packages.json")"
          if [[ "$downloaded_count" -ne "$expected_zip_count" ]]; then
            echo "::error::Expected $expected_zip_count downloadable ZIPs, found $downloaded_count"
            exit 1
          fi
