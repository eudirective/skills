name: Package FreeMovement distributions

on:
  workflow_call:
    inputs:
      final_revision:
        description: Exact synchronized and validated main commit to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build, verify, and publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact validated main snapshot
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.final_revision }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install consultation test dependencies
        run: python3 -m pip install -r freemovement-law/requirements-test.txt

      - name: Validate generated component versions
        run: >-
          python3 scripts/source-distribution/validate_versions.py
          --root .
          --registry scripts/source-distribution/country-registry.json

      - name: Run consultation core self-test on publisher revision
        run: python3 freemovement-law/skills/eudirective-core/scripts/run_selftest.py

      - name: Run consultation unittest suite on publisher revision
        run: >-
          python3 -m unittest discover
          -s freemovement-law/skills/eudirective-core/scripts
          -p 'test_*.py'

      - name: Run distribution regression tests
        run: python3 -m unittest discover -s scripts/package-distributions -p 'test_*.py'

      - name: Build twice and verify reproducibility
        id: build
        env:
          FINAL_REVISION: ${{ inputs.final_revision }}
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          [[ "$revision" = "$FINAL_REVISION" ]]
          [[ "$revision" =~ ^[0-9a-f]{40,64}$ ]]
          output_one="$RUNNER_TEMP/freemovement-distributions"
          output_two="$RUNNER_TEMP/freemovement-distributions-repeat"
          python3 scripts/package-distributions/build.py all --root . --output-dir "$output_one"
          python3 scripts/package-distributions/build.py all --root . --output-dir "$output_two"
          diff -qr "$output_one" "$output_two"
          python3 scripts/package-distributions/build.py verify --root . --distribution-dir "$output_one"
          (cd "$output_one" && sha256sum -c SHA256SUMS)
          rm -rf "$output_two"
          package_count="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1], encoding="utf-8"))["packages"]))' "$output_one/packages.json")"
          expected_count="$(python3 -c 'import json; print(len(json.load(open(".agents/plugins/marketplace.json", encoding="utf-8"))["plugins"]) + 2)')"
          if [[ "$package_count" -ne "$expected_count" ]]; then
            echo "::error::Expected $expected_count packages, found $package_count"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_one" >> "$GITHUB_OUTPUT"
          echo "package_count=$package_count" >> "$GITHUB_OUTPUT"

      - name: Save downloadable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: freemovement-distributions-${{ steps.build.outputs.revision }}
          path: |
            ${{ steps.build.outputs.output_dir }}/*.zip
            ${{ steps.build.outputs.output_dir }}/packages.json
            ${{ steps.build.outputs.output_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Confirm this build still matches main
        id: current
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          current_revision="$(git rev-parse HEAD)"
          latest_revision="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_revision" != "$latest_revision" ]]; then
            echo "::error::main advanced during packaging; refusing to publish a stale snapshot"
            exit 1
          fi
          echo "revision=$current_revision" >> "$GITHUB_OUTPUT"

      - name: Publish immutable revision and promote verified latest pointer
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_REVISION: ${{ steps.current.outputs.revision }}
          DIST_DIR: ${{ steps.build.outputs.output_dir }}
          STATE_FILE: ${{ runner.temp }}/freemovement-release-state.json
        run: >-
          python3 scripts/package-distributions/publish_release.py
          --repo eudirective/skills
          --revision "$FINAL_REVISION"
          --distribution-dir "$DIST_DIR"
          --changelog CHANGELOG.md
          --state-output "$STATE_FILE"

      - name: Save release verification state
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freemovement-release-state-${{ steps.build.outputs.revision }}
          path: ${{ runner.temp }}/freemovement-release-state.json
          if-no-files-found: error
          retention-days: 90
