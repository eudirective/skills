name: Announce FreeMovement changelog on Discord

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: discord-release-announcement-main
  cancel-in-progress: false

jobs:
  announce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish the latest version and changelog to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/package-distributions/discord_announcement.py
