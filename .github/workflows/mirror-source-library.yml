name: Mirror source library and module notes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - '.github/workflows/mirror-source-library.yml'
      - 'freemovement-law/scripts/version_manifest.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mirror-source-library
  cancel-in-progress: false

jobs:
  mirror:
    name: Sync public-data/source-library
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out skills
        uses: actions/checkout@v7
        with:
          path: skills

      - name: Check out public source data
        uses: actions/checkout@v7
        with:
          repository: eudirective/public-data
          ref: main
          path: public-data
          sparse-checkout: |
            source-library
            module-notes
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Mirror source library and stamp its exact upstream tree version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          source_dir="public-data/source-library"
          module_notes_dir="public-data/module-notes"
          destination_dir="skills/freemovement-law/skills/eudirective-source-library"
          max_attempts=3
          upstream_tree_sha="$(git -C public-data rev-parse HEAD:source-library)"
          upstream_module_notes_tree_sha="$(git -C public-data rev-parse HEAD:module-notes)"

          test -d "$source_dir"
          test -d "$module_notes_dir/sweden"
          test -d "$module_notes_dir/turkiye"
          test -f "$destination_dir/SKILL.md"
          [[ "$upstream_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$upstream_module_notes_tree_sha" =~ ^[0-9a-f]{40}$ ]]

          git -C skills config user.name "eudirective"
          git -C skills config user.email "eudirective@proton.me"
          mirror_branch="automation/source-library-mirror"

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Mirror PR update attempt $attempt of $max_attempts"

            # Rebuild from the current main so unrelated commits are preserved.
            git -C skills fetch --no-tags origin main
            git -C skills reset --hard origin/main

            # SKILL.md belongs to the skill and must never be deleted or replaced.
            rsync -a --delete --exclude='/SKILL.md' \
              "$source_dir/" "$destination_dir/"
            rsync -a --delete \
              "$module_notes_dir/" "$destination_dir/module-notes/"

            node skills/freemovement-law/scripts/version_manifest.mjs --stamp \
              --library-tree "$upstream_tree_sha" \
              --module-notes-tree "$upstream_module_notes_tree_sha"
            node skills/freemovement-law/scripts/version_manifest.mjs --verify \
              --library-tree "$upstream_tree_sha" \
              --module-notes-tree "$upstream_module_notes_tree_sha"

            git -C skills add -A -- freemovement-law/skills/eudirective-source-library \
              freemovement-law/skills/eudirective-core/references/session-version-manifest.json
            if git -C skills diff --cached --quiet; then
              echo "Already synchronized"
              exit 0
            fi

            git -C skills commit -m "Sync source library and module notes"
            remote_line="$(git -C skills ls-remote --heads origin "refs/heads/${mirror_branch}" || true)"
            if [ -n "$remote_line" ]; then
              git -C skills fetch --no-tags origin \
                "refs/heads/${mirror_branch}:refs/remotes/origin/${mirror_branch}"
              expected_head="$(git -C skills rev-parse "refs/remotes/origin/${mirror_branch}")"
            else
              expected_head=""
            fi
            if git -C skills push "--force-with-lease=refs/heads/${mirror_branch}:${expected_head}" \
                origin "HEAD:refs/heads/${mirror_branch}"; then
              existing_pr="$(gh pr list --repo eudirective/skills --head "${mirror_branch}" \
                --base main --state open --json number --jq '.[0].number // empty')"
              if [ -z "$existing_pr" ]; then
                gh pr create --repo eudirective/skills \
                  --head "$mirror_branch" --base main \
                  --title "Sync source library and module notes" \
                  --body "Automated source-library mirror update. This change is submitted through the normal review and release-authorization checks."
              fi
              echo "Source library and version fingerprint submitted as a pull request"
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Push failed; refreshing main and rebuilding the mirror commit"
              sleep "$attempt"
            fi
          done

          echo "Failed to synchronize source library after $max_attempts attempts"
          exit 1
